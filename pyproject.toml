[build-system]
requires = ["setuptools>=45", "wheel", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "pibooth-background-changer"
version = "1.0.0"
description = "Plugin pibooth pour remplacer automatiquement le fond des photos par IA"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Christophe", email = "christophe@example.com"}
]
keywords = ["pibooth", "photobooth", "background", "rembg", "ai", "raspberry-pi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Plugins",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Graphics",
]
requires-python = ">=3.7"
dependencies = [
    "pibooth>=2.0.0",
    "Pillow>=8.0.0",
    "rembg>=2.0.0",
]

[project.optional-dependencies]
gpu-nvidia = ["onnxruntime-gpu"]
gpu-intel = ["onnxruntime-openvino"]
gpu-amd-windows = ["onnxruntime-directml"]
gpu-amd-linux = ["onnxruntime-rocm"]
gpu-apple = ["onnxruntime-coreml"]

[project.urls]
Homepage = "https://github.com/ceeeeb/pibooth-background-changer"
Repository = "https://github.com/ceeeeb/pibooth-background-changer"
Issues = "https://github.com/ceeeeb/pibooth-background-changer/issues"

[project.entry-points."pibooth"]
background-changer = "pibooth_background_changer"

[tool.setuptools]
py-modules = ["pibooth_background_changer"]
